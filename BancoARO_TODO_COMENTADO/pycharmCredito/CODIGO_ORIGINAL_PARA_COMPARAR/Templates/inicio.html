<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Início | Banco ARO</title><style>body{font-family:Arial,sans-serif;background:#F7F7FA;color:#25232A;margin:0}main{max-width:780px;margin:10vh auto;background:white;padding:40px;border-radius:18px;box-shadow:0 5px 24px #ddd9e3}h1{color:#5B3A8E}a,button{background:#5B3A8E;border:0;color:white;padding:12px 18px;border-radius:8px;text-decoration:none;font-size:15px;cursor:pointer}form{display:inline}</style></head><body><main><h1>Olá, {{ usuario }}!</h1><p>Bem-vindo(a) à sua área segura do Banco ARO.</p>{% with mensagens = get_flashed_messages() %}{% for mensagem in mensagens %}<p>{{ mensagem }}</p>{% endfor %}{% endwith %}<a href="{{ url_for('editar_usuario') }}">Editar meus dados</a> <form method="post" action="{{ url_for('logout') }}"><button type="submit">Sair</button></form></main></body></html>
